# Template-only: builds the A-SAAS docs site (docs/) and, in the public
# repository, publishes it to GitHub Pages. `bun run init` deletes this
# workflow and docs/ in new projects.
name: Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "ARCHITECTURE_AND_INTEGRATIONS.md"
      - "AGENTS.md"
      - ".github/assets/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "ARCHITECTURE_AND_INTEGRATIONS.md"
      - "AGENTS.md"
      - ".github/assets/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
        working-directory: docs
      - run: bun run build
        working-directory: docs
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
      - if: github.event_name != 'pull_request' && github.repository == 'theideaiq/a-saas'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.repository == 'theideaiq/a-saas'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
