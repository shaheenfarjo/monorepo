name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Integrations are optional at build time; real keys live in Vercel.
  SKIP_ENV_VALIDATION: "true"
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_WEB_URL: http://localhost:3001
  NEXT_PUBLIC_API_URL: http://localhost:3002
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run check:placeholders

  build:
    name: Build apps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # apps/web also needs BASEHUB_TOKEN while the CMS module is installed.
      - run: bunx turbo build --filter=api --filter=app
